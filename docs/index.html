<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d21">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Руська проти слономошок!</title>
<style>
  :root { color-scheme: dark; font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff4fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #100d21; }
  main { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
  [hidden] { display: none !important; }
  .hud, .panel { position: absolute; pointer-events: none; }
  .hud { inset: calc(18px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) auto max(20px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: center; }
  .hearts { font-size: 1.65rem; letter-spacing: .16em; color: #ff7d98; }
  .empty { color: #796785; }
  .stat { color: #fff4fa; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 2px 9px #100d21; }
  #timer { font-family: ui-monospace, Consolas, monospace; color: #dbfcff; letter-spacing: .08em; }
  .panel { inset: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .heading { position: absolute; top: max(7%, env(safe-area-inset-top)); padding: 0 14px; }
  h1 { margin: 0; color: #fff1f7; font-family: "Trebuchet MS", system-ui, sans-serif; font-size: clamp(2.5rem, 9vw, 5.4rem); font-weight: 900; letter-spacing: -.055em; line-height: .96; text-shadow: 0 3px #6e315d, 0 8px 36px #d25e9b50; }
  h1 span { display: block; color: #ffb6cf; font-size: .63em; letter-spacing: -.035em; margin-top: .23em; }
  .actions { position: absolute; bottom: max(7%, calc(14px + env(safe-area-inset-bottom))); padding: 0 15px; }
  .actions p { color: #eee2f6; margin: 0 0 12px; font-size: .97rem; }
  button { pointer-events: auto; touch-action: manipulation; min-height: 52px; border: 0; border-radius: 100px; padding: 10px 27px; font: inherit; font-weight: 800; color: #31172d; background: #ffacc9; box-shadow: 0 5px 0 #9b4c79, 0 8px 35px #fa78b646; cursor: pointer; }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #9b4c79; }
  button:focus-visible { outline: 3px solid #bffaff; outline-offset: 5px; }
  .menu-options { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .menu-options .menu-button { min-height: 44px; font-weight: 700; font-size: .9rem; }
  .menu-button, .guide-dialog button { padding: 7px 14px; color: #fff4fa; background: #392844; box-shadow: none; }
  .guide-dialog { width: min(530px, calc(100% - 28px)); max-height: min(85dvh, 720px); padding: 0; border: 1px solid #80577d; border-radius: 18px; background: #1c152b; }
  .guide-dialog::backdrop { background: #100d21c9; }
  .guide-dialog form { margin: 0; }
  .guide-header { position: sticky; top: 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1c152b; border-bottom: 1px solid #483653; z-index: 1; }
  .guide-header h2 { margin: 0; font-size: 1.2rem; }
  .guide-dialog button { min-height: 40px; }
  @media (max-height: 470px) and (min-width: 500px) {
    .heading { top: 38%; left: 3%; width: 30%; }
    h1 { font-size: clamp(1.55rem, 5vw, 3.5rem); }
    .actions { bottom: auto; top: 42%; right: 2%; width: 29%; }
  }
  @media (max-height: 420px) and (max-width: 499px) {
    .heading { top: 4%; }
    h1 { font-size: 1.9rem; }
    .actions { bottom: max(5%, env(safe-area-inset-bottom)); }
  }
.bug-guide {display:grid;gap:.6rem;padding:.85rem}.bug-entry {display:grid;grid-template-columns:82px 1fr;align-items:center;gap:.7rem;padding:.5rem;border-radius:10px;background:#2a2038}.bug-entry canvas {width:82px;height:62px}.bug-entry.size-preview {grid-template-columns:110px 1fr}.bug-entry.size-preview canvas {width:110px;height:140px}.bug-entry h3,.bug-entry p {margin:0}.bug-entry p {font-size:.88rem;color:#e5d3e8}
</style>

    </div>
  </div>
</main>

function unlockSound() {
  if (!soundEnabled) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    if (!audio) {
      audio = new Audio();
      audioOutput = audio.createGain();
      audioOutput.gain.value = .55;
      audioOutput.connect(audio.destination);
      musicOutput = audio.createGain();
      musicOutput.connect(audioOutput);
      noiseBuffer = audio.createBuffer(1, audio.sampleRate * 3, audio.sampleRate);
      const samples = noiseBuffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
      const voiceData = Uint8Array.from(atob(annoyedVoiceRecording), character => character.charCodeAt(0));
      audio.decodeAudioData(voiceData.buffer).then(buffer => { annoyedVoice = buffer; }).catch(() => {});
    }
    if (audio.state === 'suspended') audio.resume().catch(() => {});
  } catch {
    audio = undefined;
  }
}

function envelope(output, when, duration, volume, attack) {
  const gain = audio.createGain();
  gain.gain.setValueAtTime(.0001, when);
  gain.gain.exponentialRampToValueAtTime(volume, when + attack);
  gain.gain.exponentialRampToValueAtTime(.0001, when + duration);
  gain.connect(output);
  return gain;
}

function tone(from, to, when, duration, volume, shape = 'sine', output = audioOutput) {
  const oscillator = audio.createOscillator();
  const gain = envelope(output, when, duration, volume, Math.min(.022, duration / 4));
  oscillator.type = shape;
  oscillator.frequency.setValueAtTime(from, when);
  oscillator.frequency.exponentialRampToValueAtTime(to, when + duration);
  oscillator.connect(gain);
  oscillator.onended = () => gain.disconnect();
  oscillator.start(when);
  oscillator.stop(when + duration);
}

function noise(when, duration, volume, frequency, filterType = 'lowpass', attack = .018, output = audioOutput) {
  const source = audio.createBufferSource();
  source.buffer = noiseBuffer;
  const filter = audio.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = frequency;
  const gain = envelope(output, when, duration, volume, attack);
  source.connect(filter).connect(gain);
  source.onended = () => { filter.disconnect(); gain.disconnect(); };
  source.start(when);
  source.stop(when + duration);
}

function sound(cue) {
  if (!soundEnabled || audio?.state !== 'running' || document.hidden) return;
  const now = audio.currentTime;
  switch (cue) {
    case 'tap':
      tone(570, 275, now, .095, .065, 'triangle');
      break;
    case 'hurt':
      tone(190, 104, now, .22, .075, 'triangle');
      break;
    case 'annoyed':
      if (annoyedVoice) {
        const voice = audio.createBufferSource();
        const level = audio.createGain();
        voice.buffer = annoyedVoice;
        level.gain.value = .88;
        voice.connect(level).connect(audioOutput);
        voice.onended = () => level.disconnect();
        voiceStartedAt = now;
        voice.start(now);
      } else {
        noise(now, .36, .19, 1150, 'bandpass', .055);
      }
      break;
    case 'switch':
      noise(now, .055, .3, 1900, 'bandpass', .004);
      tone(210, 115, now, .07, .10, 'triangle');
      break;
    case 'step':
      noise(now, .085, .084, 290, 'lowpass', .008);
      break;
    case 'flame':
      noise(now, flameEnd - flameStart, .35, 820, 'lowpass', .13);
      tone(74, 48, now, .7, .13, 'triangle');
      for (let i = 1; i <= 8; i++) noise(now + .22 * i, .28, .12, 530 + i * 35, 'bandpass', .024);
      break;
  }
}

function updateMusic() {
  if (!soundEnabled || audio?.state !== 'running' || document.hidden || state === 'ending') return;
  const now = audio.currentTime;
  if (nextNote < now) nextNote = now + .035;
  while (nextNote < now + .12) {
    const beat = musicStep % 8;
    const bar = Math.floor(musicStep / 8);
    const note = melody[bar][beat];
    if (note && (beat === 0 || beat === 3 || beat === 6)) {
      tone(hz(note), hz(note), nextNote, .24, .035, 'sine', musicOutput);
    }
    if (beat === 0 || beat === 3 || beat === 4 || beat === 7) {
      const bassNote = bass[bar] + (beat >= 4 ? 7 : 0);
      tone(hz(bassNote), hz(bassNote), nextNote, .26, beat === 0 ? .073 : .05, 'triangle', musicOutput);
    }
    if (beat === 0 || beat === 4) tone(110, 43, nextNote, .16, .15, 'sine', musicOutput);
    if (beat === 2 || beat === 6) noise(nextNote, .095, .092, 1850, 'bandpass', .005, musicOutput);
    if (beat % 2 === 1) noise(nextNote, .055, .048, 4550, 'highpass', .004, musicOutput);
    musicStep = (musicStep + 1) % (melody.length * 8);
    nextNote += 60 / 108 / 2;
  }
}

function voiceMouthOpening() {
  const elapsed = (audio?.currentTime ?? 0) - voiceStartedAt;
  if (!annoyedVoice || elapsed < 0 || elapsed >= annoyedVoice.duration) return 0;
  const samples = annoyedVoice.getChannelData(0);
  const first = Math.floor(elapsed * annoyedVoice.sampleRate);
  const stride = Math.max(1, Math.floor(annoyedVoice.sampleRate / 1600));
  const last = Math.min(samples.length, first + stride * 32);
  let peak = 0;
  for (let i = first; i < last; i += stride) peak = Math.max(peak, Math.abs(samples[i]));
  return clamp(peak * 2.7, 0, 1);
}

function readBest() {
  try { return Math.max(0, Number(localStorage.getItem('ruska-best')) || 0); }
  catch { return 0; }
}

function readBalance() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(balanceKey)) ?? {}; }
  catch {}
  const values = {};
  for (const [key, [min, max, initial]] of Object.entries(balanceLimits)) {
    values[key] = Number.isFinite(saved[key]) ? clamp(saved[key], min, max) : initial;
  }
  return values;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function mix(a, b, fraction) {
  return a + (b - a) * clamp(fraction, 0, 1);
}

function resize() {
  const bounds = canvas.getBoundingClientRect();
  const oldW = w, oldH = h;
  w = bounds.width;
  h = bounds.height;
  if (!w || !h) return;
  density = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * density);
  canvas.height = Math.round(h * density);
  ctx.setTransform(density, 0, 0, density, 0, 0);
  x = w * .5;
  y = h * .53;
  scale = clamp(Math.min(w / 395, h / 585), .46, 1.2);
  room = ctx.createRadialGradient(x, y - 16 * scale, 8, x, y, 190 * scale);
  room.addColorStop(0, '#61496e');
  room.addColorStop(.45, '#302341');
  room.addColorStop(1, '#100d21');
  if (oldW && oldH) {
    for (const bug of bugs) {
      bug.x *= w / oldW;
      bug.y *= h / oldH;
      if (['straight', 'curved', 'pass', 'medic', 'flea'].includes(bug.type)) {
        bug.angle = Math.atan2(Math.sin(bug.angle) * h / oldH, Math.cos(bug.angle) * w / oldW);
      }
    }
    sparks = [];
  }
  if (bugDialog.open) {
    document.querySelector('#bug-guide').replaceChildren();
    renderBugGuide();
  }
}

function ellipse(cx, cy, rx, ry, color, angle = 0) {
  ctx.fillStyle = color;
  ctx.beginPath();

}

function line(points, color, size) {
  ctx.strokeStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.stroke();
}

function rounded(cx, cy, width, height, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(cx, cy, width, height, radius);
  ctx.fill();
}

function drawPhone(px, py, scrolling, clip, angle) {

function scrollPose() {
  const time = reduced.matches ? 0 : clock;
  const phase = (time + .3) % 4.2;
  const scroll = smooth((phase - 3.62) / .48);
  const release = smooth((phase - 4.10) / .10);
  return { scroll, reach: scroll * (1 - release), clip: Math.floor((time + .3) / 4.2) % 3 };
}

function drawWalkArm(side, gait) {
  const shoulder = [side * 20, -27];
  const swing = -side * gait;
  const upper = swing * .48 - .08;
  const lower = upper + .19 + Math.max(0, swing) * .21;
  const elbow = [shoulder[0] + 13.5 * Math.sin(upper), shoulder[1] + 13.5 * Math.cos(upper)];
  const wrist = [elbow[0] + 11 * Math.sin(lower), elbow[1] + 11 * Math.cos(lower)];
  const palm = [wrist[0] + 5 * Math.sin(lower + .04), wrist[1] + 5 * Math.cos(lower + .04)];
  const tone = side === 1 ? skinShade : skin;
  drawArm(shoulder, elbow, wrist, tone);
  drawHand(wrist, palm, 'grip', tone);
}

    const foot = [mix(side * 11 + step * 18, side === 1 ? 8 : -2, recline), mix(46 - Math.max(0, step) * 9, side === 1 ? 49 : 62, recline)];
    limb([hip, knee, foot], side < 0 ? '#eab095' : skin, 12);
    limb([hip, [mix(hip[0], knee[0], .6), mix(0, knee[1], .6)]], side < 0 ? '#454f3d' : shorts, 15);
    ellipse(foot[0] + 2, foot[1], 7.9, 4.8, ink, .12);

    drawHand(gripWrist, onPhone(8, 3), 'grip', skinShade);
    drawPhone(phoneX, phoneY, scroll, clip, angle);
    const thumb = onPhone(6.2, 5.6);
    ellipse(...thumb, 2.6, 4.1, skin, angle - .45);
    const wrist = onPhone(-14, 16 - reach * 13);
    drawArm([-20, -24], [-15, -9 - reach * 1.9], wrist, skin);
    drawHand(wrist, onPhone(-5, 10 - reach * 13), 'point', skin);

    drawArm([21, -28], [28, -16], [45, -22], skinShade);
    drawHand([45, -22], [53, -26], 'grip', skinShade);

    rounded(29, -30, 27, 12, 5, '#a15564');
    rounded(47, -27, 17, 6, 2, '#66556f');
    rounded(59, -27.5, 7, 7, 2, '#ffcc79');
    drawArm([-20, -25], [1, -14], [29, -17], skin);
    drawHand([29, -17], [35, -23], 'grip', skin);

  ctx.restore();
}

function smooth(progress) {
  const fraction = clamp(progress, 0, 1);
  return fraction * fraction * (3 - 2 * fraction);
}

function start() {
  unlockSound();
  state = 'play';
  score = 0;
  lives = maxHearts;
  playTime = 0;
  spawnIn = .55;
  introducedCurved = false;
  nextQueen = balance.queenStart;
  nextElephant = 90;
  nextMedic = 0;
  slowUntil = 0;
  hitEffect = 0;
  impact = undefined;
  voiceStartedAt = -Infinity;
  bugs = [];
  sparks = [];
  panel.hidden = true;
  hud.hidden = false;
  updateHud();
}

function updateHud() {
  document.querySelector('#full').textContent = '♥'.repeat(lives);
  document.querySelector('#empty').textContent = '♡'.repeat(maxHearts - lives);
  hearts.setAttribute('aria-label', 'Сердечка: ' + lives + ' з ' + maxHearts);
  scoreLabel.textContent = score;
  updateTimer();
}

function formatTime(seconds) {
  const whole = Math.floor(seconds);
  const minutes = String(Math.floor(whole / 60)).padStart(2, '0');
  return minutes + ':' + String(whole % 60).padStart(2, '0');
}

function updateTimer() {
  const second = Math.floor(playTime);
  if (second === displayedSecond) return;
  displayedSecond = second;
  timer.textContent = formatTime(second);
}

function typeShare(time, type, ramp) {
  const start = balance[type + 'Start'];
  if (time < start) return 0;
  return mix(balance[type + 'First'], balance[type + 'Max'], (time - start) / ramp) / 100;
}

function bugType(time, roll) {
  let curvedChance = typeShare(time, 'curved', 85);
  let pirouetteChance = typeShare(time, 'pirouette', 100);
  let chaoticChance = typeShare(time, 'chaotic', 95);
  const specialShare = curvedChance + pirouetteChance + chaoticChance;
  const factor = specialShare > 1 ? 1 / specialShare : 1;
  curvedChance *= factor;
  pirouetteChance *= factor;
  chaoticChance *= factor;
  if (roll < curvedChance) return 'curved';
  if (roll < curvedChance + pirouetteChance) return 'pirouette';
  if (roll < curvedChance + pirouetteChance + chaoticChance) return 'chaotic';
  return 'straight';
}

function bugSizeClass(roll) {
  if (playTime >= nextElephant && !bugs.some(bug => bug.sizeClass === 'elephant')) {
    nextElephant = playTime + 65;
    return 'elephant';
  }
  if (playTime >= nextQueen && !bugs.some(bug => bug.sizeClass === 'queen')) {
    nextQueen = playTime + balance.queenInterval;
    return 'queen';
  }
  const giantChance = playTime >= balance.giantStart ? balance.giantChance / 100 : 0;
  const largeChance = playTime >= balance.largeStart ? balance.largeChance / 100 : 0;
  if (roll < giantChance) return 'giant';
  if (roll < giantChance + largeChance) return 'large';
  return 'small';
}

function bugSize(bug) {
  return balance[bug.sizeClass + 'Size'] / 100 || bugSizes[bug.sizeClass].scale;
}

function spawn() {
  const side = Math.floor(Math.random() * 4);
  const margin = 30 * scale;
  const progress = 1 - Math.exp(-playTime / 88);
  const introduceCurved = !introducedCurved && typeShare(playTime, 'curved', 85) > 0;
  const sizeClass = bugSizeClass(Math.random());
  const maxHits = bugSizes[sizeClass].hits;
  let type = introduceCurved ? 'curved' : bugType(playTime, Math.random());
  if (!introduceCurved && sizeClass === 'small') {
    const bonus = Math.random();
    if (lives < maxHearts && playTime >= nextMedic && !bugs.some(bug => bug.type === 'medic') && bonus < .065) {
      type = 'medic';
      nextMedic = playTime + 24;
    } else if (playTime >= 18 && bonus >= .065 && bonus < .105) {
      type = 'flea';
    } else if (playTime >= 24 && bonus >= .105 && bonus < .155) {
      type = 'orbit';
    }
  }
  const boss = sizeClass === 'queen' || sizeClass === 'elephant';
  if (type === 'straight' && !boss && Math.random() < balance.straightAcross / 100) type = 'pass';
  if (type === 'curved') introducedCurved = true;
  const fromX = side === 0 ? -margin : side === 1 ? w + margin : mix(.14, .86, Math.random()) * w;
  const fromY = side === 2 ? -margin : side === 3 ? h + margin : mix(.14, .86, Math.random()) * h;
  const across = type === 'curved' || type === 'pass';
  const acrossX = side === 0 ? w + margin : side === 1 ? -margin : fromX < x ? .13 * w : .87 * w;
  const acrossY = side === 2 ? h + margin : side === 3 ? -margin : fromY < y ? .13 * h : .87 * h;
  const entryX = across && side >= 2 ? acrossX : fromX;
  const entryY = across && side < 2 ? acrossY : fromY;
  bugs.push({
    x: entryX,
    y: entryY,
    speed: (46 + Math.random() * 20 + progress * 91 * balance.speedGrowth / 100)
      * clamp(h / 700, .78, 1.22) * (balance[type + 'Speed'] ?? balance.straightSpeed) / 100
      * (balance[sizeClass + 'Speed'] ?? (sizeClass === 'elephant' ? 65 : 100)) / 100,
    type,
    sizeClass,
    hits: maxHits,
    maxHits,
    born: playTime,
    lastHit: -Infinity,
    side,
    turnAt: mix(.19, .29, Math.random()),
    turning: false,
    phase: Math.random() * tau,
    rate: 3.4 + Math.random() * 2.6,
    turnDirection: Math.random() < .5 ? -1 : 1,
    loopSpacing: .25 + Math.random() * .35,
    loopRemaining: 0,
    loopRate: 0,
    angle: Math.atan2((across ? acrossY : y) - entryY, (across ? acrossX : x) - entryX)
  });
}

function burst(px, py, hot = false) {
  const count = reduced.matches ? 5 : 12;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * tau;
    const speed = 25 + Math.random() * 105;
    const life = .24 + Math.random() * .34;
    sparks.push({ x: px, y: py, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life, total: life,
      color: hot ? ['#ff9059', '#ffe191'][i % 2] : ['#f9b8db', '#d5b2fd', '#fff3c4'][i % 3] });
  }
}

function touch(event) {
  if (state !== 'play' || event.button !== 0) return;
  const bounds = canvas.getBoundingClientRect();
  const px = event.clientX - bounds.left;
  const py = event.clientY - bounds.top;
  const baseRadius = Math.max(22, 23 * scale) * 1.1;
  let nearest = -1, distance = Infinity;
  for (let i = 0; i < bugs.length; i++) {
    const bug = bugs[i];
    const radius = baseRadius * bugSize(bug);
    const gap = Math.hypot(bug.x - px, bug.y - py);
    if (gap < radius && gap < distance) {
      nearest = i;
      distance = gap;
    }
  }
  if (nearest < 0) return;
  const bug = bugs[nearest];
  burst(bug.x, bug.y);
  sound('tap');
  navigator.vibrate?.(10);
  bug.lastHit = playTime;
  if (bug.hits > 1) {
    if (!bug.woundedOnce) {
      bug.woundedOnce = true;
      const slow = balance.largeWoundedSpeed / 100;
      bug.stun = balance.largeStun;
      bug.speed *= slow;
      bug.loopRate *= slow;
    }
    bug.hits--;
    return;
  }
  bugs.splice(nearest, 1);
  if (bug.type === 'flea') slowUntil = playTime + 3;
  score++;
  updateHud();
}

function insideField(bug, margin) {
  return bug.x > margin && bug.x < w - margin && bug.y > margin && bug.y < h - margin;
}

function moveAlongRoute(bug, dt) {
  if (bug.type === 'curved') {
    const crossed = [bug.x / w, 1 - bug.x / w, bug.y / h, 1 - bug.y / h][bug.side];
    if (crossed >= bug.turnAt) bug.turning = true;
    if (bug.turning) {
      const delta = Math.atan2(y - bug.y, x - bug.x) - bug.angle;
      const turn = Math.atan2(Math.sin(delta), Math.cos(delta));
      const maxTurn = 1.9 * dt * balance.curvedTurn / 100;
      bug.angle += clamp(turn, -maxTurn, maxTurn);
    }
  }
  bug.x += Math.cos(bug.angle) * bug.speed * dt;
  bug.y += Math.sin(bug.angle) * bug.speed * dt;
}

function moveBug(bug, dt, difficulty) {
  if (bug.stun > 0) {
    const paused = Math.min(dt, bug.stun);
    bug.stun -= paused;
    dt -= paused;
  }
  if (bug.type === 'orbit') {
    const dx = bug.x - x;
    const dy = bug.y - y;
    const distance = Math.hypot(dx, dy);
    const radius = Math.min(w, h) * .34;
    const radial = Math.atan2(dy, dx);
    bug.angle = radial + Math.PI / 2 + Math.atan2(distance - radius, 24 * scale);
    if (playTime - bug.born > 12) bug.angle = radial;
    bug.x += Math.cos(bug.angle) * bug.speed * dt;
    bug.y += Math.sin(bug.angle) * bug.speed * dt;
    return;
  }
  if (bug.type === 'straight' || bug.type === 'curved' || bug.type === 'pass' || bug.type === 'medic' || bug.type === 'flea') {
    moveAlongRoute(bug, dt);
    return;
  }
  const speed = bug.speed;
  const radius = mix(16, 29, difficulty) * scale * balance.pirouetteRadius / 100;
  if (bug.type === 'pirouette' && bug.loopRemaining === 0) {
    bug.loopSpacing -= dt;
    const distance = Math.hypot(x - bug.x, y - bug.y);
    if (bug.loopSpacing <= 0 && insideField(bug, radius * 2 + 4) && distance > 77 * scale * ruskaSize + radius * 2) {
      bug.angle = Math.atan2(y - bug.y, x - bug.x);
      bug.loopRemaining = tau;
      bug.loopRate = bug.turnDirection * speed / radius;
      bug.turnDirection *= -1;
      bug.loopSpacing = mix(2.7, 1.15, difficulty);
    }
  }
  if (bug.loopRemaining > 0) {
    const swept = Math.min(bug.loopRemaining, Math.abs(bug.loopRate) * dt);
    const nextAngle = bug.angle + Math.sign(bug.loopRate) * swept;
    const signedRadius = speed / bug.loopRate;
    bug.x += signedRadius * (Math.sin(nextAngle) - Math.sin(bug.angle));
    bug.y += signedRadius * (Math.cos(bug.angle) - Math.cos(nextAngle));
    bug.angle = nextAngle;
    bug.loopRemaining = Math.max(0, bug.loopRemaining - swept);
    if (bug.loopRemaining < 1e-8) bug.loopRemaining = 0;
    dt -= swept / Math.abs(bug.loopRate);
    if (dt < 1e-8) return;
  }
  let drift = 0;
  if (bug.type === 'chaotic' && insideField(bug, 12 * scale)) {
    const wave = playTime * bug.rate + bug.phase;
    const swing = Math.sin(wave) + .32 * Math.sin(wave * 1.75 + bug.phase);
    const boundary = Math.min(bug.x, w - bug.x, bug.y, h - bug.y);
    drift = mix(.52, 1.78, difficulty) * swing
      * clamp((boundary - 12 * scale) / (25 * scale), 0, 1) * balance.chaoticDrift / 100;
  }
  bug.angle = Math.atan2(y - bug.y, x - bug.x) + drift;
  bug.x += Math.cos(bug.angle) * speed * dt;
  bug.y += Math.sin(bug.angle) * speed * dt;
}

function play(dt, elapsed = dt) {
  playTime += elapsed;
  updateTimer();
  const pacedStep = dt * gameplayPace;
  spawnIn -= pacedStep;
  hitEffect = Math.max(0, hitEffect - dt);
  if (spawnIn <= 0) {
    spawn();
    spawnIn = (.53 + 1.02 * Math.exp(-playTime / 63)) * (.86 + Math.random() * .28) * 100 / balance.spawnRate;
  }
  const difficulty = clamp(playTime / 110, 0, 1);
  const characterScale = scale * ruskaSize;
  for (let i = bugs.length - 1; i >= 0; i--) {
    const bug = bugs[i];
    if (bug.sizeClass === 'elephant' && playTime - bug.lastHit > .45) bug.hits = Math.min(bug.maxHits, bug.hits + 3 * elapsed);
    moveBug(bug, pacedStep * (playTime < slowUntil ? .5 : 1), difficulty);
    if (!insideField(bug, -42 * scale)) {
      if (bug.sizeClass === 'queen' || bug.sizeClass === 'elephant') {
        bug.x = clamp(bug.x, -30 * scale, w + 30 * scale);
        bug.y = clamp(bug.y, -30 * scale, h + 30 * scale);
        bug.angle = Math.atan2(y - bug.y, x - bug.x);
        bug.loopRemaining = 0;
        bug.turning = true;
        continue;
      }
      bugs.splice(i, 1);
      continue;
    }
    // Collision ellipse follows the horizontal silhouette.
    if (Math.hypot((bug.x - x) / (77 * characterScale), (bug.y - y - 4 * characterScale) / (30 * characterScale)) > 1) continue;
    if (bug.type === 'pass' || bug.type === 'orbit') continue;
    bugs.splice(i, 1);
    if (bug.type === 'medic') {
      lives = Math.min(maxHearts, lives + 1);
      burst(bug.x, bug.y);
      updateHud();
      continue;
    }
    lives--;
    sound(lives === 0 ? 'annoyed' : 'hurt');
    hitEffect = hitCooldown;
    const dx = (bug.x - x) / scale;
    const dy = (bug.y - y) / scale;
    impact = { dx, dy, angle: Math.hypot(dx, dy) > 1 ? Math.atan2(dy, dx) : bug.angle + Math.PI };
    updateHud();
    if (lives === 0) {
      state = 'ending';
      ending = 0;
      if (score > best) {
        best = score;
        try { localStorage.setItem('ruska-best', String(best)); } catch {}
      }
      return;
    }
  }
}

function finish(dt) {
  const before = ending;
  ending += dt;
  hitEffect = Math.max(0, hitEffect - dt);
  if ([.68, .99, 1.29, 1.6, 4.72, 5.04].some(time => before < time && ending >= time)) sound('step');
  if ((before < lightsOn && ending >= lightsOn) || (before < lightsOff && ending >= lightsOff)) {
    sound('switch');
  }
  if (before < flameStart && ending >= flameStart && !document.hidden) {
    sound('flame');
    navigator.vibrate?.(flameVibration);
  }
  if (ending >= flameStart && ending < flameEnd) {
    const front = mix(-60, w + 75, (ending - flameStart) / 1.85);
    bugs = bugs.filter(bug => {
      if (bug.x > front && ending < 4.15) return true;
      burst(bug.x, bug.y, true);
      return false;
    });
  }
  if (ending < 6.05) return;
  state = 'menu';
  hud.hidden = true;
  summary.textContent = formatTime(playTime) + ' · Збито ' + score + ' · Рекорд ' + best;
  button.textContent = 'Почати знову';
  panel.hidden = false;
}

function drawRoom(lit) {
  ctx.fillStyle = lit ? '#423247' : room;
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  if (lit) {
    const switchX = w / (2 * scale) - 32;
    rounded(switchX - 9, -32, 18, 26, 4, '#cc9a9b');
    rounded(switchX - 3, -27, 6, 9, 2, '#ffdfb5');
  }
  ellipse(0, 84, 87 * ruskaSize, 9 * ruskaSize, lit ? '#3d2d48' : '#20172d');
  ctx.restore();
}

function drawBug(bug, lit) {
  ctx.save();
  ctx.translate(bug.x, bug.y);
  const size = scale * bugSize(bug);
  ctx.scale(size, size);
  ctx.save();
  ctx.rotate(bug.angle);
  const light = Math.hypot((bug.x - x), (bug.y - y));
  ctx.globalAlpha = lit ? 1 : clamp(1.4 - light / (225 * scale), .40, 1);
  const flap = reduced.matches || bug.stun > 0 ? .38 : .32 + Math.abs(Math.sin(clock * 33 + bug.phase)) * .53;
  const { wing, eye, body = '#866c9e' } = bugColors[bug.type];
  ellipse(-4, -8, 10, 4, wing, flap);
  ellipse(-4, 8, 10, 4, wing, -flap);
  ellipse(-2, 0, 10, 7, body);
  ellipse(6, 0, 6, 6, '#b296c1');
  line([[9, 1], [16, 2], [16, 6], [13, 6]], '#b296c1', 3);
  ellipse(8, -2, 2.6, 2.4, eye);
  ellipse(8.8, -2, 1, 1, '#3f2751');
  ctx.restore();
  if (bug.sizeClass === 'queen') {
    shape('M-8 -14 L-10 -22 L-4 -18 L0 -25 L4 -18 L10 -22 L8 -14Z', '#f4bc54', '#663954', 1);
    ellipse(0, -17.5, 1.4, 1.8, '#d85380');
  }
  if (bug.sizeClass === 'elephant') {
    rounded(-15, 12, 30, 4, 2, '#412638');
    if (bug.hits > 0) rounded(-15, 12, 30 * bug.hits / bug.maxHits, 4, 1.5, '#9fe48f');
  } else if (bug.maxHits > 2) {
    for (let i = 0; i < bug.maxHits; i++) {
      ellipse((i - (bug.maxHits - 1) / 2) * 3.4, 13, 1.25, 1.25, i < bug.hits ? '#fff0bd' : '#65445e');
    }
  }
  ctx.restore();
}

function renderBugGuide() {
  const guide = document.querySelector('#bug-guide');
  if (guide.childElementCount) return;
  const entries = [
    ['Типи польоту', [
      ['Мошка', 'straight', 'Летить прямо до Руськи.'],
      ['Мимомошка', 'pass', 'Летить прямо повз Руську.'],
      ['Мошкомуха', 'chaotic', 'Петляє на шляху до Руськи.'],
      ['Мошколіна', 'pirouette', 'Робить піруети на шляху до Руськи.'],
      ['Підломошка', 'curved', 'Схожа на Мимомошку. Спершу летить повз, потім завертає до Руськи.'],
      ['Мошколікар', 'medic', 'Рідкісна рожева мошка. Дотик до Руськи відновлює одне сердечко. Поява лише за неповного здоров’я.'],
      ['Мошкоблошка', 'flea', 'Після влучання сповільнює всіх мошок на 3 секунди.'],
      ['Мимопідломошка', 'orbit', 'Кружляє навколо Руськи й пролітає далі. Руська від неї не втрачає сердечок.'],
    ]],
    ['Розміри', [
      ['Мінімошка', 'straight', '1 влучання.', 'small'],
      ['Крупномошка', 'chaotic', '2 влучання. Може мати будь-який із п’яти типів польоту.', 'large'],
      ['Мошкозавр', 'pirouette', '4 влучання. Може мати будь-який із п’яти типів польоту.', 'giant'],
      ['Мамамошка', 'straight', '6 влучань. У короні й завжди прямує до Руськи.', 'queen'],
      ['Слономошка', 'curved', '15 влучань. Здоров’я швидко відновлюється між ударами. Завжди прямує до Руськи.', 'elephant'],
    ]]
  ];
  for (const [sectionTitle, items] of entries) {
    const heading = document.createElement('h3');
    heading.textContent = sectionTitle;
    guide.append(heading);
    for (const [name, type, description, sizeClass = 'small'] of items) {
      const card = document.createElement('article');
      const sizePreview = sectionTitle === 'Розміри';
      card.className = sizePreview ? 'bug-entry size-preview' : 'bug-entry';
      const preview = document.createElement('canvas');
      preview.width = sizePreview ? 220 : 164;
      preview.height = sizePreview ? 280 : 124;
      preview.setAttribute('aria-hidden', 'true');
      const copy = document.createElement('div');
      const title = document.createElement('h3');
      const detail = document.createElement('p');
      title.textContent = name;
      detail.textContent = description;
      copy.append(title, detail);
      card.append(preview, copy);
      guide.append(card);
      const gameContext = ctx;
      const target = preview.getContext('2d');
      if (!target) continue;
      const hits = bugSizes[sizeClass].hits;
      const bug = { x: 0, y: 0, type: sizePreview ? 'neutral' : type, sizeClass, hits, maxHits: hits, angle: 0, phase: 0 };
      const zoom = sizePreview ? 2 : Math.min(3.1, 3.6 / bugSize(bug)) / scale;
      target.setTransform(zoom, 0, 0, zoom, sizePreview ? 110 : 73, sizePreview ? 140 : sizeClass === 'queen' ? 76 : 58);
      try {
        ctx = target;
        drawBug(bug, true);
      } finally {
        ctx = gameContext;
      }
    }
  }
}

function drawFlame(px, py, direction) {
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(direction * scale, scale);
  for (let i = 0; i < 12; i++) {
    const shift = reduced.matches ? .5 : (clock * 3.2 + i / 12) % 1;
    const length = shift * 125;
    ellipse(length, Math.sin(i * 1.8) * length * .19, 8 + shift * 15, 5 + shift * 10,
      ['#ff7b65bb', '#ffbb6bcc', '#ffe7a0de'][i % 3], Math.sin(i) * .18);
  }
  ctx.restore();
}

function phoneLight(px, py, recline) {
  const beat = (clock + .3) % 12.6;
  const clip = beat < 4.1 ? 0 : beat < 8.4 ? 1 : 2;
  const color = reduced.matches ? '130, 232, 255' : ['130, 232, 255', '234, 151, 244', '152, 255, 213'][clip];
  const since = beat - [0, 4.1, 8.4][clip];
  const pulse = reduced.matches ? 0 : Math.max(0, 1 - since / .55);
  const shimmer = reduced.matches ? 0 : .018 * Math.sin(clock * 6);
  const angle = -1.38 * recline;
  const localX = mix(29, 13, recline);
  const localY = mix(-41, -20, recline);
  const phoneX = px + (localX * Math.cos(angle) - localY * Math.sin(angle)) * scale * ruskaSize;
  const phoneY = py + (localX * Math.sin(angle) + localY * Math.cos(angle)) * scale * ruskaSize;
  const radius = 112 * scale;
  const gradient = ctx.createRadialGradient(phoneX, phoneY, 0, phoneX, phoneY, radius);
  gradient.addColorStop(0, 'rgba(' + color + ', ' + (.25 + pulse * .20 + shimmer) + ')');
  gradient.addColorStop(.55, 'rgba(' + color + ', .06)');
  gradient.addColorStop(1, 'rgba(' + color + ', 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(phoneX - radius, phoneY - radius, radius * 2, radius * 2);
}

function drawImpact(progress) {
  const px = x + impact.dx * scale;
  const py = y + impact.dy * scale;
  const fade = 1 - progress;
  const radius = (9 + 13 * progress) * scale;
  ctx.save();
  ctx.globalAlpha = fade * .82;
  const glow = ctx.createRadialGradient(px, py, 0, px, py, radius);
  glow.addColorStop(0, '#ffd9b9');
  glow.addColorStop(.27, '#ff8fa599');
  glow.addColorStop(1, '#ff738800');
  ctx.fillStyle = glow;
  ctx.fillRect(px - radius, py - radius, radius * 2, radius * 2);
  ellipse(px, py, 2.8 * scale, 2.8 * scale, '#fff2db');
  if (!reduced.matches) {
    for (const offset of [-.95, -.48, 0, .48, .95]) {
      const angle = impact.angle + offset;
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const inner = (3 + progress * 15) * scale;
      const outer = inner + (3 + fade * 6) * scale;
      line([[px + dx * inner, py + dy * inner], [px + dx * outer, py + dy * outer]],
        offset === 0 ? '#ffe8b8' : '#ff9bad', 1.6 * scale);
    }
  }
  ctx.restore();
}

function render() {
  if (!room) return;
  const cinematic = state === 'ending';
  const lit = cinematic && ending >= lightsOn && ending < lightsOff;
  drawRoom(lit);
  let rx = x, ry = y, recline = 1, phone = true, torch = false, walking = 0, direction = 1;
  const bob = reduced.matches ? 0 : Math.sin(clock * 2.4) * 4 * scale;
  if (!cinematic) {
    ry += bob;
  } else if (ending < flameStart) {
    phone = false;
    recline = 1 - smooth(ending / .58);
    ry = mix(y, y + 40 * scale, 1 - recline);
    rx = ending < lightsOn ? mix(x, w + 20 * scale, (ending - .45) / 1.35) : w + 90 * scale;
    walking = smooth((ending - .45) / .23);
  } else if (ending < flameEnd) {
    phone = false;
    torch = true;
    walking = 1;
    recline = 0;
    ry = y + 40 * scale + bob * .7;
    rx = mix(-95 * scale, w + 90 * scale, (ending - flameStart) / (flameEnd - flameStart));
    drawFlame(rx + 65 * scale * ruskaSize, ry - 20 * scale * ruskaSize, 1);
  } else {
    rx = mix(w + 38 * scale, x, (ending - flameEnd) / .85);
    recline = smooth((ending - 5.3) / .51);
    ry = mix(y + 40 * scale, y + bob, recline);
    walking = 1 - smooth((ending - 5.08) / .22);
    direction = ending < 5.3 ? -1 : 1;
    phone = ending >= 5.5;
  }
  rx += 18 * scale * recline;
  ry += 8 * scale * recline;
  const progress = (hitCooldown - hitEffect) / impactDuration;
  const showImpact = impact && progress < 1;
  const flinch = showImpact && !reduced.matches ? Math.max(0, 1 - progress * 2.8) : 0;
  if (showImpact && !reduced.matches) {
    const recoil = Math.sin(Math.PI * progress) * (1 - progress) * 9 * scale;
    rx -= Math.cos(impact.angle) * recoil;
    ry -= Math.sin(impact.angle) * recoil;
  }
  if (phone && !lit) phoneLight(rx, ry, recline);
  drawCharacter(rx, ry, recline, phone, torch, cinematic && ending < flameEnd, walking, direction, flinch);
  if (phone && !lit) {
    ctx.save();
    ctx.globalAlpha = .34;
    ctx.globalCompositeOperation = 'screen';
    phoneLight(rx, ry, recline);
    ctx.restore();
  }
  for (const bug of bugs) drawBug(bug, lit);
  if (showImpact) drawImpact(progress);
  for (const spark of sparks) {
    ctx.globalAlpha = spark.life / spark.total;
    ellipse(spark.x, spark.y, 2.6 * scale, 2.6 * scale, spark.color);
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  const elapsed = last === null ? 0 : (now - last) / 1000;
  const dt = Math.min(elapsed, .05);
  last = now;
  clock += dt;
  if (state === 'play' && !document.hidden) play(dt, elapsed);
  else if (state === 'ending') finish(dt);
  updateMusic();
  let activeSparks = 0;
  for (const spark of sparks) {
    spark.life -= dt;
    if (spark.life <= 0) continue;
    spark.x += spark.vx * dt;
    spark.y += spark.vy * dt;
    sparks[activeSparks++] = spark;
  }
  sparks.length = activeSparks;
  render();
  requestAnimationFrame(frame);
}

button.addEventListener('click', start);
soundButton.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  setSoundLabel();
  try { localStorage.setItem('ruska-sound', soundEnabled ? 'on' : 'off'); } catch {}
  if (soundEnabled) unlockSound();
  if (audioOutput) audioOutput.gain.setTargetAtTime(soundEnabled ? .55 : .0001, audio.currentTime, .025);
});
setSoundLabel();
document.querySelector('#open-bugs').addEventListener('click', () => { renderBugGuide(); bugDialog.showModal(); });
canvas.addEventListener('pointerdown', touch);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  last = null;
  if (document.hidden) navigator.vibrate?.(0);
  if (audioOutput) audioOutput.gain.setTargetAtTime(soundEnabled && !document.hidden ? .55 : .0001, audio.currentTime, .025);
});
resize();
requestAnimationFrame(frame);
</script>

    });
